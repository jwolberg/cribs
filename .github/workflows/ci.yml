# CI for cribs. The repo is one SKILL.md plus docs (no package manager, build,
# or test suite), so the gate is scripts/check.sh: skill frontmatter and
# relative Markdown links. Job name `quality` is what branch protection requires
# (docs/runbooks/branch-protection.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repo checks
        run: bash scripts/check.sh
